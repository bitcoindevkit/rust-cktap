on:
  push:
    branches:
      - 'master'
      - 'release/*'
  pull_request:
    branches:
      - 'master'
      - 'release/*'

name: CI

jobs:

  build:
    name: Build workspace
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - version: stable
          - version: 1.85.0 # MSRV
            msrv: true
        features:
          - --no-default-features
          - --features default
          - --all-features
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust.version }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install PCSC development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig
      - name: Use MSRV Cargo.toml # Don't include "cli" in workspace if using MSRV
        if: ${{ matrix.rust.msrv }}
        run: cp Cargo.toml.MSRV Cargo.toml
      - name: Build
        run: cargo build ${{ matrix.features }}

  test:
    name: Test with emulator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - version: stable
          - version: 1.85.0 # MSRV
            msrv: true
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust.version }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Use MSRV Cargo.toml # Don't include "cli" in workspace if using MSRV
        if: ${{ matrix.rust.msrv }}
        run: cp Cargo.toml.MSRV Cargo.toml
      - name: Install PCSC development libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y swig libpcsclite-dev
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: |
          cd ${{ github.workspace }}
          python3 -m venv emulator_env
          source emulator_env/bin/activate
          pip install -U pip wheel
          pip install -r coinkite/coinkite-tap-proto/emulator/requirements.txt
          cargo test -p rust-cktap --features emulator

  rust_fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check fmt
        run: cargo +nightly fmt --all

  clippy_check:
    name: Clippy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install libpcsclite-dev
        run: sudo apt install libpcsclite-dev
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

